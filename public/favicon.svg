<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ícone da aba: a escala de exposição da logo, em cinco faixas
       verticais do preto (-2) ao branco (+2). -->
  <rect width="32" height="32" fill="#ffffff"/>
  <rect x="0" width="6.4" height="32" fill="#232323"/>
  <rect x="6.4" width="6.4" height="32" fill="#585858"/>
  <rect x="12.8" width="6.4" height="32" fill="#8c8c8c"/>
  <rect x="19.2" width="6.4" height="32" fill="#c2c2c2"/>
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#232323" stroke-width="2"/>
</svg>
