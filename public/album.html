<!DOCTYPE html>
<!-- Página de um álbum: grade de fotos + visualizador com EXIF.
     O álbum é escolhido pela URL: album.html?slug=nome-do-album -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Álbum · Acervo Fotográfico</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/common.js" defer></script>
    <script src="js/gallery.js" defer></script>
    <script src="js/album.js" defer></script>
</head>
<body class="page-wide">
    <header class="site-header">
        <a class="site-header__logo" href="index.html">Acervo Fotográfico</a>
        <nav class="site-nav" id="site-nav"></nav>
    </header>

    <main>
        <h1 class="page-title" id="album-title"></h1>
        <p class="page-subtitle" id="album-description"></p>

        <p class="status" id="status">Carregando…</p>

        <!-- As miniaturas são inseridas aqui pelo album.js. O visualizador
             em tela cheia é criado pelo gallery.js. -->
        <section class="photo-grid" id="photos" aria-label="Fotos do álbum"></section>
    </main>
</body>
</html>
