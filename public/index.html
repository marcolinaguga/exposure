<!DOCTYPE html>
<!-- Página inicial: lista de álbuns. -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Faz o layout se adaptar à largura do celular. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acervo Fotográfico</title>
    <meta name="description" content="Acervo fotográfico pessoal.">
    <link rel="stylesheet" href="css/style.css">
    <!-- "defer": baixa os scripts sem travar a página e os executa, NA
         ORDEM, depois que o HTML foi lido. -->
    <script src="js/common.js" defer></script>
    <script src="js/home.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="site-header__logo" href="index.html">Acervo Fotográfico</a>
        <nav class="site-nav" id="site-nav"></nav>
    </header>

    <main>
        <h1 class="page-title">Álbuns</h1>
        <p class="page-subtitle">Fotografias organizadas por álbum.</p>

        <!-- Mensagens de "carregando", "vazio" ou erro. -->
        <p class="status" id="status">Carregando…</p>

        <!-- Os cartões dos álbuns são inseridos aqui pelo home.js. -->
        <section class="album-grid" id="albums" aria-label="Álbuns"></section>
    </main>

    <footer class="site-footer">
        <a href="admin.html">Entrar</a>
    </footer>
</body>
</html>
